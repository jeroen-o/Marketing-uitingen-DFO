  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"90eb7487-72b6-45cc-8cf9-57f2baf2b5f6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <script src=\"d86c7221-676c-4ecd-aaed-937abe31ff0b\"><\u002Fscript>\n  <style>/* Modernist — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b89da3ee-ae30-4f86-ab96-2dbc92a8ad38\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"3185e656-a95a-4b5c-99e9-c53bd6bd5982\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"52a02d66-94e7-4a07-b4cc-00978f0bc867\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b89da3ee-ae30-4f86-ab96-2dbc92a8ad38\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"3185e656-a95a-4b5c-99e9-c53bd6bd5982\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"52a02d66-94e7-4a07-b4cc-00978f0bc867\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b89da3ee-ae30-4f86-ab96-2dbc92a8ad38\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"3185e656-a95a-4b5c-99e9-c53bd6bd5982\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"52a02d66-94e7-4a07-b4cc-00978f0bc867\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"be82b7a0-8d96-4f87-93d3-4a489aa1ba70\"><\u002Fscript>\n  <style>\n    body { margin: 0; }\n    :root {\n      --color-accent: #1467ab;\n      --color-accent-400: #4a8cc2;\n      --color-accent-500: #1467ab;\n      --color-accent-600: #115a92;\n      --color-accent-700: #0d4f9e;\n      --color-accent-800: #0b3f70;\n      --color-accent-900: #082f54;\n      --color-accent-100: #e3eef7;\n      --color-accent-200: #c2dbee;\n      --color-accent-300: #8fbede;\n    }\n    a { color: var(--color-accent-700); } a:hover { color: var(--color-accent); }\n    @media (max-width: 880px) {\n      .split { grid-template-columns: 1fr !important; }\n      .page { padding: 20px 12px 48px !important; }\n    }\n    @media (max-width: 560px) {\n      .twocol { grid-template-columns: 1fr !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"page\" style=\"min-height:100vh;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);padding:36px 28px 72px\">\n  <div style=\"max-width:1220px;margin:0 auto\">\n\n    <sc-if value=\"{{ showHelp }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeHelp }}\" style=\"position:fixed;inset:0;background:rgba(32,30,29,0.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto\">\n        <div sc-camel-on-click=\"{{ stopClick }}\" style=\"background:#fff;border:2px solid #0d4f9e;max-width:680px;width:100%;padding:32px 36px;cursor:default\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px\">\n            <h2 style=\"font-family:var(--font-heading);font-weight:700;font-size:22px;margin:0;color:#0d4f9e\">Handleiding<\u002Fh2>\n            <button sc-camel-on-click=\"{{ closeHelp }}\" style=\"border:2px solid #c9c6c4;background:#fff;color:#201e1d;font-size:14px;font-weight:600;padding:6px 12px;cursor:pointer;font-family:inherit\">Sluiten ✕<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 18px;font-size:13.5px;line-height:1.6;color:var(--color-neutral-700)\">Met deze tool maak je in een paar minuten alle marketinguitingen voor jouw DFO-label.<\u002Fp>\n\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#0d4f9e;margin-bottom:6px\">Stap 1 — Kies je label<\u002Fdiv>\n          <p style=\"margin:0 0 14px;font-size:13.5px;line-height:1.65\">Klik bovenaan op het label waarvoor je materiaal maakt. Logo, kleuren, hashtags en tagline worden automatisch overgenomen. Met <strong>Eigen logo…<\u002Fstrong> upload je een ander logo; de kleuren worden dan automatisch uit het logo gehaald.<\u002Fp>\n\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#0d4f9e;margin-bottom:6px\">Stap 2 — Vul je gegevens in<\u002Fdiv>\n          <p style=\"margin:0 0 14px;font-size:13.5px;line-height:1.65\">Ga naar het tabblad <strong>E-mailhandtekening<\u002Fstrong> en vul je naam, functie en contactgegevens één keer in. Alle andere onderdelen (visitekaartje, banner, Teams-achtergrond en post) gebruiken automatisch dezelfde gegevens. Met de vinkjes \"tonen\" bepaal je wat zichtbaar is. Voeg eventueel een pasfoto en een eigen bedrijfslogo toe.<\u002Fp>\n\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#0d4f9e;margin-bottom:6px\">Stap 3 — Maak en download je uitingen<\u002Fdiv>\n          <ul style=\"margin:0 0 14px;padding-left:20px;font-size:13.5px;line-height:1.7\">\n            <li><strong>E-mailhandtekening<\u002Fstrong> — klik op \"Kopieer naar klembord\" en plak hem in Outlook (stappenplan staat onder het voorbeeld).<\u002Fli>\n            <li><strong>Visitekaartje<\u002Fstrong> — kies een formaat en download voor- en achterkant als drukklare PNG (300 DPI, met afloop).<\u002Fli>\n            <li><strong>LinkedIn-banner<\u002Fstrong> — upload eventueel een achtergrondfoto en download op 1584 × 396 px.<\u002Fli>\n            <li><strong>Teams-achtergrond<\u002Fstrong> — kies logo- en tekstpositie en download op 1920 × 1080 px.<\u002Fli>\n            <li><strong>LinkedIn-post<\u002Fstrong> — maak een post-afbeelding, schrijf de tekst (met vet/cursief/onderstrepen), en kopieer tekst + hashtags.<\u002Fli>\n          <\u002Ful>\n\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#0d4f9e;margin-bottom:6px\">Gegevens bewaren<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.65\">Klik op <strong>Gegevens opslaan<\u002Fstrong> om al je invoer als bestand te bewaren. De volgende keer laad je alles in één keer terug met <strong>Gegevens uploaden<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:space-between\">\n    <div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n      <sc-if value=\"{{ headerLogoReady }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"img\" aria-label=\"DFO - dienstverlening voor financiële ondernemers\" style=\"{{ dfoHeaderStyle }}\"><\u002Fdiv><\u002Fsc-if>\n      <h1 style=\"font-family:var(--font-heading);font-weight:700;font-size:32px;margin:0;letter-spacing:-0.01em;color:#0d4f9e\">Marketing uitingen DFO<\u002Fh1>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openHelp }}\" style=\"padding:10px 18px;font-family:inherit;font-weight:600;font-size:13.5px;border:2px solid #0d4f9e;background:#0d4f9e;color:#fff;border-radius:0;cursor:pointer;text-align:left\">? Handleiding<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin:6px 0 18px;font-size:15px;color:var(--color-neutral-700);max-width:660px\">Kies een label, vul je gegevens één keer in en maak er een e-mailhandtekening, visitekaartje, LinkedIn-banner, Teams-achtergrond en LinkedIn-post van.<\u002Fp>\n    <div style=\"height:2px;background:var(--color-divider);margin-bottom:18px\"><\u002Fdiv>\n\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">Label<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px\">\n      <sc-for list=\"{{ labelList }}\" as=\"lb\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ lb.pick }}\" style=\"{{ lb.style }}\">\n          <span style=\"display:block\">{{ lb.naam }}<\u002Fspan>\n          <sc-if value=\"{{ lb.logo }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"{{ lb.logoBoxStyle }}\"><\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isEigen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap\">\n        <label class=\"btn btn-primary\" style=\"cursor:pointer\">Kies eigen logo\n          <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upEigenLogo }}\" style=\"display:none\">\n        <\u002Flabel>\n        <span style=\"font-size:13px;color:var(--color-neutral-700)\">{{ eigenLabel }}<\u002Fspan>\n        <input type=\"text\" class=\"input\" value=\"{{ eigenNaam }}\" sc-camel-on-change=\"{{ upEigenNaam }}\" placeholder=\"Naam van het label\" style=\"width:240px\">\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"height:2px;background:var(--color-divider);margin-bottom:18px\"><\u002Fdiv>\n\n    <div class=\"tabs\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px\">\n      <button sc-camel-on-click=\"{{ setTabH }}\" style=\"{{ tabHStyle }}\">E-mailhandtekening<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabK }}\" style=\"{{ tabKStyle }}\">Visitekaartje<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabB }}\" style=\"{{ tabBStyle }}\">LinkedIn-banner<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabT }}\" style=\"{{ tabTStyle }}\">Teams-achtergrond<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabP }}\" style=\"{{ tabPStyle }}\">LinkedIn-post<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ tabHandtekening }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"split\" style=\"display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:28px;align-items:start\">\n\n      <div style=\"background:#fff;border:2px solid var(--color-divider);padding:24px 24px 10px\">\n        <div style=\"display:flex;gap:8px;margin-bottom:18px\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveData }}\" style=\"flex:1\">Gegevens opslaan<\u002Fbutton>\n          <label class=\"btn btn-secondary\" style=\"flex:1;cursor:pointer\">Gegevens uploaden\n            <input type=\"file\" accept=\"application/json,.json\" sc-camel-on-change=\"{{ uploadData }}\" style=\"display:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:14px\">Persoonlijke gegevens<\u002Fdiv>\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">Naam<\u002Flabel>\n        <input type=\"text\" class=\"input\" value=\"{{ naam }}\" sc-camel-on-change=\"{{ upNaam }}\" placeholder=\"Jan de Vries\" style=\"width:100%;margin-bottom:14px\">\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">Functietitel<\u002Flabel>\n        <input type=\"text\" class=\"input\" value=\"{{ functie }}\" sc-camel-on-change=\"{{ upFunctie }}\" placeholder=\"Adviseur\" style=\"width:100%;margin-bottom:14px\">\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">Bedrijfsnaam<\u002Flabel>\n        <input type=\"text\" class=\"input\" value=\"{{ bedrijf }}\" sc-camel-on-change=\"{{ upBedrijf }}\" placeholder=\"De Vries Advies\" style=\"width:100%;margin-bottom:20px\">\n\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:14px\">Contactgegevens<\u002Fdiv>\n\n        <div class=\"twocol\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n          <div>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font-weight:600\">Telefoon<\u002Fspan><label style=\"font-weight:400;font-size:11.5px;color:var(--color-neutral-700);display:flex;align-items:center;gap:5px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ showTelefoon }}\" sc-camel-on-change=\"{{ toggleTelefoon }}\" style=\"width:14px;height:14px;accent-color:var(--color-accent);cursor:pointer\">tonen<\u002Flabel><\u002Fdiv>\n            <input type=\"text\" class=\"input\" value=\"{{ telefoon }}\" sc-camel-on-change=\"{{ upTelefoon }}\" placeholder=\"030 - 123 45 67\" style=\"width:100%;margin-bottom:14px\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font-weight:600\">Mobiel<\u002Fspan><label style=\"font-weight:400;font-size:11.5px;color:var(--color-neutral-700);display:flex;align-items:center;gap:5px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ showMobiel }}\" sc-camel-on-change=\"{{ toggleMobiel }}\" style=\"width:14px;height:14px;accent-color:var(--color-accent);cursor:pointer\">tonen<\u002Flabel><\u002Fdiv>\n            <input type=\"text\" class=\"input\" value=\"{{ mobiel }}\" sc-camel-on-change=\"{{ upMobiel }}\" placeholder=\"06 - 12 34 56 78\" style=\"width:100%;margin-bottom:14px\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font-weight:600\">E-mailadres<\u002Fspan><label style=\"font-weight:400;font-size:11.5px;color:var(--color-neutral-700);display:flex;align-items:center;gap:5px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ showEmail }}\" sc-camel-on-change=\"{{ toggleEmail }}\" style=\"width:14px;height:14px;accent-color:var(--color-accent);cursor:pointer\">tonen<\u002Flabel><\u002Fdiv>\n        <input type=\"email\" class=\"input\" value=\"{{ email }}\" sc-camel-on-change=\"{{ upEmail }}\" placeholder=\"jan@devriesadvies.nl\" style=\"width:100%;margin-bottom:14px\">\n\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font-weight:600\">Website<\u002Fspan><label style=\"font-weight:400;font-size:11.5px;color:var(--color-neutral-700);display:flex;align-items:center;gap:5px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ showWebsite }}\" sc-camel-on-change=\"{{ toggleWebsite }}\" style=\"width:14px;height:14px;accent-color:var(--color-accent);cursor:pointer\">tonen<\u002Flabel><\u002Fdiv>\n        <input type=\"text\" class=\"input\" value=\"{{ website }}\" sc-camel-on-change=\"{{ upWebsite }}\" placeholder=\"www.devriesadvies.nl\" style=\"width:100%;margin-bottom:14px\">\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">Adres<\u002Flabel>\n        <input type=\"text\" class=\"input\" value=\"{{ adres }}\" sc-camel-on-change=\"{{ upAdres }}\" placeholder=\"Dorpsstraat 12, 3500 AA Utrecht\" style=\"width:100%;margin-bottom:14px\">\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">LinkedIn (URL)<\u002Flabel>\n        <input type=\"text\" class=\"input\" value=\"{{ linkedin }}\" sc-camel-on-change=\"{{ upLinkedin }}\" placeholder=\"linkedin.com/in/jandevries\" style=\"width:100%;margin-bottom:20px\">\n\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:14px\">Afbeeldingen<\u002Fdiv>\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 6px\">Pasfoto (optioneel)<\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n          <label class=\"btn btn-primary\" style=\"cursor:pointer\">Kies foto\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upFoto }}\" style=\"display:none\">\n          <\u002Flabel>\n          <span style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ fotoLabel }}<\u002Fspan>\n          <sc-if value=\"{{ foto }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ clearFoto }}\" style=\"border:none;background:none;color:var(--color-accent-700);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline\">verwijder<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 6px\">Bedrijfslogo (optioneel, naast het labellogo)<\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\">\n          <label class=\"btn btn-primary\" style=\"cursor:pointer\">Kies logo\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upLogo }}\" style=\"display:none\">\n          <\u002Flabel>\n          <span style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ logoLabel }}<\u002Fspan>\n          <sc-if value=\"{{ bedrijfslogo }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ clearLogo }}\" style=\"border:none;background:none;color:var(--color-accent-700);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline\">verwijder<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:12px\">Opties<\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 14px;border:2px solid var(--color-divider);margin-bottom:24px\">\n          <input type=\"checkbox\" checked=\"{{ showDisclaimer }}\" sc-camel-on-change=\"{{ toggleDisclaimer }}\" style=\"width:17px;height:17px;accent-color:var(--color-accent);cursor:pointer\">\n          <span style=\"font-size:13.5px\">Juridische disclaimer toevoegen (NL + EN)<\u002Fspan>\n        <\u002Flabel>\n\n        <sc-if value=\"{{ showDisclaimer }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom:24px\">\n          <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">Disclaimer (Nederlands)<\u002Flabel>\n          <textarea class=\"input\" value=\"{{ disclaimerNL }}\" sc-camel-on-change=\"{{ upDiscNL }}\" rows=\"4\" style=\"width:100%;margin-bottom:14px;resize:vertical;font-size:13px;line-height:1.5\"><\u002Ftextarea>\n          <label style=\"display:block;font-size:12.5px;font-weight:600;margin:0 0 5px\">Disclaimer (English)<\u002Flabel>\n          <textarea class=\"input\" value=\"{{ disclaimerEN }}\" sc-camel-on-change=\"{{ upDiscEN }}\" rows=\"4\" style=\"width:100%;resize:vertical;font-size:13px;line-height:1.5\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Voorbeeld<\u002Fdiv>\n          <span style=\"font-size:12px;color:var(--color-neutral-500)\">Zo verschijnt je handtekening<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:2px solid var(--color-divider);padding:32px;min-height:220px;overflow:auto\">\n          <div ref=\"{{ setPreview }}\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;margin-top:20px;flex-wrap:wrap\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ copySig }}\" style=\"flex:1;min-width:200px\">{{ copyLabel }}<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ downloadSig }}\">Download als HTML<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:2px solid var(--color-divider);padding:24px 28px;margin-top:20px\">\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;margin-bottom:14px\">Instellen in Outlook<\u002Fdiv>\n          <div style=\"font-weight:600;font-size:13.5px;margin-bottom:8px\">Nieuwe Outlook &amp; Outlook op het web<\u002Fdiv>\n          <ol style=\"margin:0 0 18px;padding-left:20px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.7\">\n            <li>Klik hierboven op <strong>Kopieer naar klembord<\u002Fstrong>.<\u002Fli>\n            <li>Ga naar <strong>Instellingen → Account → Handtekeningen<\u002Fstrong>.<\u002Fli>\n            <li>Maak een nieuwe handtekening en plak met <strong>Ctrl&nbsp;+&nbsp;V<\u002Fstrong> (Mac: Cmd&nbsp;+&nbsp;V).<\u002Fli>\n            <li>Sla op en stel in als standaard voor nieuwe berichten.<\u002Fli>\n          <\u002Fol>\n          <div style=\"font-weight:600;font-size:13.5px;margin-bottom:8px\">Klassieke Outlook (desktop)<\u002Fdiv>\n          <ol style=\"margin:0;padding-left:20px;font-size:13.5px;color:var(--color-neutral-700);line-height:1.7\">\n            <li>Klik op <strong>Kopieer naar klembord<\u002Fstrong>.<\u002Fli>\n            <li>Ga naar <strong>Bestand → Opties → E-mail → Handtekeningen<\u002Fstrong>.<\u002Fli>\n            <li>Maak een nieuwe handtekening, klik in het tekstvak en plak met <strong>Ctrl&nbsp;+&nbsp;V<\u002Fstrong>.<\u002Fli>\n            <li>Werkt plakken niet met afbeeldingen? Gebruik dan <strong>Download als HTML<\u002Fstrong> en open dat bestand in een browser om te kopiëren.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabKaart }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"split\" style=\"display:grid;grid-template-columns:minmax(0,400px) 1fr;gap:28px;align-items:start\">\n\n      <div style=\"background:#fff;border:2px solid var(--color-divider);padding:24px 26px\">\n        <div style=\"font-family:var(--font-heading);font-weight:700;font-size:17px;margin-bottom:8px\">Visitekaartje<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:13.5px;line-height:1.6;color:var(--color-neutral-700)\">Het kaartje gebruikt automatisch dezelfde gegevens en logo's als je handtekening. Pas ze aan bij het tabblad <strong>E-mailhandtekening<\u002Fstrong>.<\u002Fp>\n\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">Formaat<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:20px\">\n          <button sc-camel-on-click=\"{{ setFmtStandaard }}\" style=\"{{ fmtStandaardStyle }}\">Standaard visitekaartje<span style=\"opacity:.7;font-weight:400\"> · 85 × 55 mm<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setFmtLiggend }}\" style=\"{{ fmtLiggendStyle }}\">Klapkaartje liggend<span style=\"opacity:.7;font-weight:400\"> · 170 × 55 mm<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setFmtStaand }}\" style=\"{{ fmtStaandStyle }}\">Klapkaartje staand<span style=\"opacity:.7;font-weight:400\"> · 110 × 85 mm<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:4px\">Kleuren<\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:11.5px;color:var(--color-neutral-500)\">Standaard de huisstijlkleuren van het gekozen label.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px\">\n          <label style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px\">Hoofdkleur (accent)<input type=\"color\" value=\"{{ accent }}\" sc-camel-on-input=\"{{ upAccent }}\" style=\"width:44px;height:28px;border:1px solid var(--color-neutral-300);padding:0;cursor:pointer;background:none\"><\u002Flabel>\n          <label style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px\">Voorkant achtergrond<input type=\"color\" value=\"{{ frontBg }}\" sc-camel-on-input=\"{{ upFrontBg }}\" style=\"width:44px;height:28px;border:1px solid var(--color-neutral-300);padding:0;cursor:pointer;background:none\"><\u002Flabel>\n          <label style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px\">Achterkant achtergrond<input type=\"color\" value=\"{{ backBg }}\" sc-camel-on-input=\"{{ upBackBg }}\" style=\"width:44px;height:28px;border:1px solid var(--color-neutral-300);padding:0;cursor:pointer;background:none\"><\u002Flabel>\n          <label style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px\">Achterkant tekst<input type=\"color\" value=\"{{ backText }}\" sc-camel-on-input=\"{{ upBackText }}\" style=\"width:44px;height:28px;border:1px solid var(--color-neutral-300);padding:0;cursor:pointer;background:none\"><\u002Flabel>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ resetColors }}\" style=\"border:none;background:none;color:var(--color-accent-700);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;margin-bottom:22px\">Herstel labelkleuren<\u002Fbutton>\n\n
